<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <rect width="1280" height="420" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="40" y="20" width="560" height="380" rx="24" fill="#f0ecfc"/>
    <rect x="680" y="20" width="560" height="380" rx="24" fill="#f0ecfc"/>

    <!-- A: a and c need a CZ, but their qubits are not linked -->
    <path d="M150,220 Q320,-4 490,220" fill="none" stroke="#8a8aa0" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="320" y="90" text-anchor="middle" font-size="36" font-weight="700" fill="#8a8aa0">CZ</text>
    <line x1="150" y1="220" x2="490" y2="220" stroke="#1c1c2e" stroke-width="6"/>
    <circle cx="150" cy="220" r="40" fill="#ffffff" stroke="#1c1c2e" stroke-width="4"/>
    <circle cx="320" cy="220" r="40" fill="#ffffff" stroke="#1c1c2e" stroke-width="4"/>
    <circle cx="490" cy="220" r="40" fill="#ffffff" stroke="#1c1c2e" stroke-width="4"/>
    <g font-size="40" font-style="italic" fill="#1c1c2e" text-anchor="middle">
      <text x="150" y="231">a</text>
      <text x="320" y="231">b</text>
      <text x="490" y="231">c</text>
    </g>
    <!-- SWAP a and b -->
    <path d="M170,278 Q235,342 300,278" fill="none" stroke="#6c4cf1" stroke-width="4" stroke-linecap="round"/>
    <path d="M165.7,273.8 L184.2,280.7 L172.9,292.1 Z" fill="#6c4cf1"/>
    <path d="M304.3,273.8 L297.1,292.1 L285.8,280.7 Z" fill="#6c4cf1"/>
    <text x="235" y="364" text-anchor="middle" font-size="36" font-weight="700" fill="#6c4cf1">SWAP</text>

    <!-- then -->
    <line x1="612" y1="220" x2="652" y2="220" stroke="#6c4cf1" stroke-width="4" stroke-linecap="round"/>
    <path d="M668,220 L650,228 L650,212 Z" fill="#6c4cf1"/>

    <!-- B: after the SWAP, a sits next to c and the CZ runs on a coupler -->
    <line x1="790" y1="220" x2="960" y2="220" stroke="#1c1c2e" stroke-width="6"/>
    <line x1="960" y1="220" x2="1130" y2="220" stroke="#6c4cf1" stroke-width="8"/>
    <text x="1045" y="202" text-anchor="middle" font-size="36" font-weight="700" fill="#6c4cf1">CZ</text>
    <circle cx="790" cy="220" r="40" fill="#ffffff" stroke="#1c1c2e" stroke-width="4"/>
    <circle cx="960" cy="220" r="40" fill="#ffffff" stroke="#1c1c2e" stroke-width="4"/>
    <circle cx="1130" cy="220" r="40" fill="#ffffff" stroke="#1c1c2e" stroke-width="4"/>
    <g font-size="40" font-style="italic" fill="#1c1c2e" text-anchor="middle">
      <text x="790" y="231">b</text>
      <text x="960" y="231">a</text>
      <text x="1130" y="231">c</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440">
  <rect width="1280" height="440" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- panels -->
    <rect x="40" y="20" width="580" height="400" rx="24" fill="#f0ecfc"/>
    <rect x="660" y="20" width="580" height="400" rx="24" fill="#f0ecfc"/>
    <g fill="#6c4cf1" font-size="36" font-weight="700" letter-spacing="1" text-anchor="middle">
      <text x="330" y="74">DIGITAL</text>
      <text x="950" y="74">ANALOG</text>
    </g>

    <!-- DIGITAL: separate gates on chosen qubits -->
    <g stroke="#8a8aa0" stroke-width="3">
      <line x1="80" y1="140" x2="529" y2="140"/>
      <line x1="80" y1="220" x2="529" y2="220"/>
      <line x1="80" y1="300" x2="529" y2="300"/>
    </g>
    <g fill="#6c4cf1">
      <rect x="132" y="112" width="56" height="56" rx="12"/>
      <rect x="132" y="272" width="56" height="56" rx="12"/>
      <rect x="312" y="272" width="56" height="56" rx="12"/>
      <rect x="402" y="192" width="56" height="56" rx="12"/>
    </g>
    <line x1="250" y1="140" x2="250" y2="220" stroke="#6c4cf1" stroke-width="4"/>
    <circle cx="250" cy="140" r="12" fill="#6c4cf1"/>
    <circle cx="250" cy="220" r="22" fill="#6c4cf1"/>
    <g stroke="#ffffff" stroke-width="4">
      <line x1="239" y1="220" x2="261" y2="220"/>
      <line x1="250" y1="209" x2="250" y2="231"/>
    </g>

    <!-- ANALOG: one smooth evolution of all qubits -->
    <g stroke="#8a8aa0" stroke-width="3">
      <line x1="700" y1="140" x2="1149" y2="140"/>
      <line x1="700" y1="220" x2="1149" y2="220"/>
      <line x1="700" y1="300" x2="1149" y2="300"/>
    </g>
    <rect x="730" y="108" width="360" height="224" rx="16" fill="#ffffff" stroke="#6c4cf1" stroke-width="4"/>
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M766,124 C886,124 934,316 1054,316" stroke="#8a8aa0"/>
      <path d="M766,316 C886,316 934,124 1054,124" stroke="#6c4cf1"/>
    </g>

    <!-- meters (both panels) -->
    <g stroke="#1c1c2e" stroke-width="3" stroke-linecap="round">
      <g fill="#ffffff">
        <rect x="529" y="114" width="52" height="52" rx="12"/>
        <rect x="529" y="194" width="52" height="52" rx="12"/>
        <rect x="529" y="274" width="52" height="52" rx="12"/>
        <rect x="1149" y="114" width="52" height="52" rx="12"/>
        <rect x="1149" y="194" width="52" height="52" rx="12"/>
        <rect x="1149" y="274" width="52" height="52" rx="12"/>
      </g>
      <g fill="none">
        <path d="M540,150 A15,15 0 0 1 570,150"/>
        <path d="M540,230 A15,15 0 0 1 570,230"/>
        <path d="M540,310 A15,15 0 0 1 570,310"/>
        <path d="M1160,150 A15,15 0 0 1 1190,150"/>
        <path d="M1160,230 A15,15 0 0 1 1190,230"/>
        <path d="M1160,310 A15,15 0 0 1 1190,310"/>
      </g>
      <line x1="555" y1="150" x2="565.5" y2="132"/>
      <line x1="555" y1="230" x2="565.5" y2="212"/>
      <line x1="555" y1="310" x2="565.5" y2="292"/>
      <line x1="1175" y1="150" x2="1185.5" y2="132"/>
      <line x1="1175" y1="230" x2="1185.5" y2="212"/>
      <line x1="1175" y1="310" x2="1185.5" y2="292"/>
    </g>

    <!-- time arrows -->
    <g stroke="#6c4cf1" stroke-width="4" stroke-linecap="round">
      <line x1="80" y1="356" x2="534" y2="356"/>
      <line x1="700" y1="356" x2="1154" y2="356"/>
    </g>
    <g fill="#6c4cf1">
      <path d="M550,356 L532,348 L532,364 Z"/>
      <path d="M1170,356 L1152,348 L1152,364 Z"/>
    </g>
    <g fill="#6c4cf1" font-size="30" text-anchor="end">
      <text x="550" y="398">time</text>
      <text x="1170" y="398">time</text>
    </g>
  </g>
</svg>

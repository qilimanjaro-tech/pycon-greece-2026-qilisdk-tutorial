<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <rect width="1280" height="480" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- annotation row -->
    <g fill="#6c4cf1" font-size="30" text-anchor="middle">
      <text x="70" y="56">qubits</text>
      <text x="220" y="56">start</text>
      <text x="420" y="56">gate</text>
      <text x="620" y="56">CNOT</text>
      <text x="820" y="56">measure</text>
      <text x="1040" y="56">one shot</text>
    </g>

    <!-- qubit labels and initial states -->
    <g fill="#1c1c2e" font-size="40">
      <text x="48" y="174">q</text>
      <text x="72" y="186" font-size="30">0</text>
      <text x="48" y="314">q</text>
      <text x="72" y="326" font-size="30">1</text>
    </g>
    <g fill="#1c1c2e" font-size="40" text-anchor="middle">
      <text x="220" y="174">|0⟩</text>
      <text x="220" y="314">|0⟩</text>
    </g>

    <!-- wires -->
    <g stroke="#8a8aa0" stroke-width="3">
      <line x1="270" y1="160" x2="778" y2="160"/>
      <line x1="270" y1="300" x2="778" y2="300"/>
    </g>

    <!-- H gate on qubit 0 -->
    <rect x="378" y="118" width="84" height="84" rx="12" fill="#6c4cf1"/>
    <text x="420" y="174" fill="#ffffff" font-size="40" font-weight="700" text-anchor="middle">H</text>

    <!-- CNOT: control on qubit 0, target on qubit 1 -->
    <line x1="620" y1="160" x2="620" y2="300" stroke="#6c4cf1" stroke-width="4"/>
    <circle cx="620" cy="160" r="12" fill="#6c4cf1"/>
    <circle cx="620" cy="300" r="28" fill="#6c4cf1"/>
    <g stroke="#ffffff" stroke-width="4">
      <line x1="606" y1="300" x2="634" y2="300"/>
      <line x1="620" y1="286" x2="620" y2="314"/>
    </g>

    <!-- meters -->
    <g stroke="#1c1c2e" stroke-width="3" stroke-linecap="round">
      <rect x="778" y="118" width="84" height="84" rx="12" fill="#ffffff"/>
      <path d="M796,176 A24,24 0 0 1 844,176" fill="none"/>
      <line x1="820" y1="176" x2="837" y2="147"/>
      <rect x="778" y="258" width="84" height="84" rx="12" fill="#ffffff"/>
      <path d="M796,316 A24,24 0 0 1 844,316" fill="none"/>
      <line x1="820" y1="316" x2="837" y2="287"/>
    </g>

    <!-- meter to bit arrows -->
    <g stroke="#6c4cf1" stroke-width="4" stroke-linecap="round">
      <line x1="880" y1="160" x2="980" y2="160"/>
      <line x1="880" y1="300" x2="980" y2="300"/>
    </g>
    <g fill="#6c4cf1">
      <path d="M996,160 L978,152 L978,168 Z"/>
      <path d="M996,300 L978,292 L978,308 Z"/>
    </g>

    <!-- one shot: one bit per qubit -->
    <g fill="#f0ecfc">
      <rect x="1016" y="130" width="48" height="60" rx="10"/>
      <rect x="1016" y="270" width="48" height="60" rx="10"/>
    </g>
    <g fill="#1c1c2e" font-size="36" text-anchor="middle">
      <text x="1040" y="173">1</text>
      <text x="1040" y="313">1</text>
    </g>

    <!-- time arrow -->
    <line x1="270" y1="400" x2="1164" y2="400" stroke="#6c4cf1" stroke-width="4" stroke-linecap="round"/>
    <path d="M1180,400 L1162,392 L1162,408 Z" fill="#6c4cf1"/>
    <text x="1180" y="442" fill="#6c4cf1" font-size="30" text-anchor="end">time</text>
  </g>
</svg>

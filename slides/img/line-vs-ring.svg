<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440">
  <rect width="1280" height="440" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="40" y="20" width="580" height="400" rx="24" fill="#f0ecfc"/>
    <rect x="660" y="20" width="580" height="400" rx="24" fill="#f0ecfc"/>
    <g font-size="36" font-weight="700" fill="#6c4cf1" letter-spacing="1" text-anchor="middle">
      <text x="330" y="74">LINE</text>
      <text x="950" y="74">RING</text>
    </g>

    <!-- LINE: couplers 0-1, 1-2, 2-3; the QFT also needs 0-2, 1-3, 0-3 -->
    <g fill="none" stroke="#8a8aa0" stroke-width="4" stroke-dasharray="12 10">
      <path d="M126,345 Q262,185 398,345"/>
      <path d="M262,345 Q398,185 534,345"/>
      <path d="M126,345 C162,65 498,65 534,345"/>
    </g>
    <line x1="126" y1="345" x2="534" y2="345" stroke="#1c1c2e" stroke-width="6"/>
    <g fill="#ffffff" stroke="#1c1c2e" stroke-width="4">
      <circle cx="126" cy="345" r="40"/>
      <circle cx="262" cy="345" r="40"/>
      <circle cx="398" cy="345" r="40"/>
      <circle cx="534" cy="345" r="40"/>
    </g>
    <g font-size="40" font-weight="700" fill="#1c1c2e" text-anchor="middle">
      <text x="126" y="359">0</text>
      <text x="262" y="359">1</text>
      <text x="398" y="359">2</text>
      <text x="534" y="359">3</text>
    </g>

    <!-- RING: the line plus coupler 3-0; the QFT still needs 0-2, 1-3 -->
    <g stroke="#8a8aa0" stroke-width="4" stroke-dasharray="12 10">
      <line x1="860" y1="165" x2="1040" y2="345"/>
      <line x1="1040" y1="165" x2="860" y2="345"/>
    </g>
    <path d="M860,165 L1040,165 L1040,345 L860,345" fill="none" stroke="#1c1c2e" stroke-width="6"/>
    <line x1="860" y1="345" x2="860" y2="165" stroke="#6c4cf1" stroke-width="8"/>
    <g fill="#ffffff" stroke="#1c1c2e" stroke-width="4">
      <circle cx="860" cy="165" r="40"/>
      <circle cx="1040" cy="165" r="40"/>
      <circle cx="1040" cy="345" r="40"/>
      <circle cx="860" cy="345" r="40"/>
    </g>
    <g font-size="40" font-weight="700" fill="#1c1c2e" text-anchor="middle">
      <text x="860" y="179">0</text>
      <text x="1040" y="179">1</text>
      <text x="1040" y="359">2</text>
      <text x="860" y="359">3</text>
    </g>
  </g>
</svg>

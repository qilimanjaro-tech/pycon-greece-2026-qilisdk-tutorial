<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <rect width="1280" height="480" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- H gates: one per layer of paths -->
    <rect x="358" y="22" width="84" height="84" rx="12" fill="#6c4cf1"/>
    <text x="400" y="78" fill="#ffffff" font-size="40" font-weight="700">H</text>
    <rect x="838" y="22" width="84" height="84" rx="12" fill="#6c4cf1"/>
    <text x="880" y="78" fill="#ffffff" font-size="40" font-weight="700">H</text>

    <!-- positive paths -->
    <g stroke="#6c4cf1" stroke-width="4" stroke-linecap="round">
      <line x1="214" y1="190" x2="568" y2="190"/>
      <line x1="210.6" y1="209" x2="572.6" y2="344.7"/>
      <line x1="694" y1="190" x2="1048" y2="190"/>
      <line x1="690.6" y1="209" x2="1052.6" y2="344.7"/>
      <line x1="690.6" y1="351" x2="1052.6" y2="215.3"/>
    </g>
    <g fill="#6c4cf1">
      <path d="M586,190 L568,198 L568,182 Z"/>
      <path d="M589.4,351 L569.8,352.2 L575.4,337.2 Z"/>
      <path d="M1066,190 L1048,198 L1048,182 Z"/>
      <path d="M1069.4,351 L1049.8,352.2 L1055.4,337.2 Z"/>
      <path d="M1069.4,209 L1055.4,222.8 L1049.8,207.8 Z"/>
    </g>

    <!-- negative path: |1> to |1> under H carries a minus sign -->
    <line x1="694" y1="370" x2="1048" y2="370" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>
    <path d="M1066,370 L1048,378 L1048,362 Z" fill="#e5484d"/>
    <circle cx="880" cy="370" r="24" fill="#ffffff" stroke="#e5484d" stroke-width="4"/>
    <line x1="868" y1="370" x2="892" y2="370" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>

    <!-- basis-state nodes: rows |0> and |1>, columns start / after H / after H H -->
    <g fill="#ffffff" stroke-width="4">
      <circle cx="160" cy="190" r="46" stroke="#6c4cf1"/>
      <circle cx="160" cy="370" r="46" stroke="#8a8aa0"/>
      <circle cx="640" cy="190" r="46" stroke="#6c4cf1"/>
      <circle cx="640" cy="370" r="46" stroke="#6c4cf1"/>
      <circle cx="1120" cy="190" r="46" stroke="#6c4cf1"/>
      <circle cx="1120" cy="370" r="46" stroke="#8a8aa0"/>
    </g>
    <g fill="#1c1c2e" font-size="40">
      <text x="160" y="204">|0⟩</text>
      <text x="160" y="384" fill="#8a8aa0">|1⟩</text>
      <text x="640" y="204">|0⟩</text>
      <text x="640" y="384">|1⟩</text>
      <text x="1120" y="204">|0⟩</text>
      <text x="1120" y="384" fill="#8a8aa0">|1⟩</text>
    </g>

    <!-- amplitudes -->
    <g fill="#1c1c2e" font-size="36">
      <text x="640" y="130">1/√2</text>
      <text x="640" y="456">1/√2</text>
      <text x="1120" y="130">1/2 + 1/2 = 1</text>
      <text x="1120" y="456">1/2 <tspan fill="#e5484d">− 1/2</tspan> = 0</text>
    </g>
  </g>
</svg>

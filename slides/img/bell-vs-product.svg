<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <rect width="1280" height="420" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Product state |+> (x) |+> : every outcome 1/4 -->
    <rect x="40" y="20" width="580" height="380" rx="24" fill="#f0ecfc"/>
    <text x="330" y="84" font-size="40" font-weight="700" fill="#6c4cf1">|+⟩ ⊗ |+⟩</text>

    <g fill="#6c4cf1" fill-opacity="0.45">
      <rect x="172" y="112" width="150" height="120" rx="16"/>
      <rect x="338" y="112" width="150" height="120" rx="16"/>
      <rect x="172" y="248" width="150" height="120" rx="16"/>
      <rect x="338" y="248" width="150" height="120" rx="16"/>
    </g>
    <g fill="#1c1c2e">
      <g font-size="36">
        <text x="247" y="158">00</text>
        <text x="413" y="158">01</text>
        <text x="247" y="294">10</text>
        <text x="413" y="294">11</text>
      </g>
      <g font-size="40" font-weight="700">
        <text x="247" y="212">1/4</text>
        <text x="413" y="212">1/4</text>
        <text x="247" y="348">1/4</text>
        <text x="413" y="348">1/4</text>
      </g>
    </g>

    <!-- Bell state (|00> + |11>)/sqrt2 : only matching outcomes -->
    <rect x="660" y="20" width="580" height="380" rx="24" fill="#f0ecfc"/>
    <text x="950" y="84" font-size="40" font-weight="700" fill="#6c4cf1">(|00⟩ + |11⟩)/√2</text>

    <rect x="792" y="112" width="150" height="120" rx="16" fill="#6c4cf1"/>
    <rect x="958" y="248" width="150" height="120" rx="16" fill="#6c4cf1"/>
    <rect x="959.5" y="113.5" width="147" height="117" rx="14.5" fill="#ffffff" stroke="#8a8aa0" stroke-width="3"/>
    <rect x="793.5" y="249.5" width="147" height="117" rx="14.5" fill="#ffffff" stroke="#8a8aa0" stroke-width="3"/>

    <g font-size="36">
      <text x="867" y="158" fill="#ffffff">00</text>
      <text x="1033" y="158" fill="#8a8aa0">01</text>
      <text x="867" y="294" fill="#8a8aa0">10</text>
      <text x="1033" y="294" fill="#ffffff">11</text>
    </g>
    <g font-size="40" font-weight="700">
      <text x="867" y="212" fill="#ffffff">1/2</text>
      <text x="1033" y="212" fill="#8a8aa0">0</text>
      <text x="867" y="348" fill="#8a8aa0">0</text>
      <text x="1033" y="348" fill="#ffffff">1/2</text>
    </g>
  </g>
</svg>

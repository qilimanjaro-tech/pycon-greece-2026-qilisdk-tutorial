<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <rect width="1280" height="400" fill="#ffffff"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="40" y="20" width="580" height="360" rx="24" fill="#f0ecfc"/>
    <rect x="660" y="20" width="580" height="360" rx="24" fill="#f0ecfc"/>
    <g font-size="36" font-weight="700" letter-spacing="1" fill="#6c4cf1" text-anchor="middle">
      <text x="330" y="70">BIT</text>
      <text x="950" y="70">QUBIT</text>
    </g>

    <!-- BIT: one of two values -->
    <g fill="#ffffff" stroke="#6c4cf1" stroke-width="4">
      <circle cx="330" cy="152" r="44"/>
      <circle cx="330" cy="304" r="44"/>
    </g>
    <g font-size="40" font-weight="700" fill="#6c4cf1" text-anchor="middle">
      <text x="330" y="166">0</text>
      <text x="330" y="318">1</text>
    </g>
    <text x="330" y="238" text-anchor="middle" font-size="30" fill="#6c4cf1">or</text>

    <!-- QUBIT: a point on a sphere whose poles are |0> and |1> -->
    <circle cx="850" cy="226" r="90" fill="#ffffff" stroke="#1c1c2e" stroke-width="3"/>
    <ellipse cx="850" cy="226" rx="90" ry="23" fill="none" stroke="#8a8aa0" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="850" y1="226" x2="927.9" y2="181" stroke="#6c4cf1" stroke-width="5" stroke-linecap="round"/>
    <g fill="#6c4cf1">
      <circle cx="850" cy="136" r="11"/>
      <circle cx="850" cy="316" r="11"/>
      <circle cx="927.9" cy="181" r="11"/>
    </g>
    <g font-size="40" fill="#1c1c2e">
      <text x="850" y="112" text-anchor="middle">|0⟩</text>
      <text x="850" y="364" text-anchor="middle">|1⟩</text>
      <text x="958" y="194">α|0⟩ + β|1⟩</text>
    </g>
  </g>
</svg>
